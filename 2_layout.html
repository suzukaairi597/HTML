<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Layout #2</title>
    <style>
        /* 기본 초기화 및 공통 스타일 */
        * {
            margin: 0;
            padding: 0;
        }

        #container {
            width: 800px;
            margin: 0 auto;
            padding: 10px;
            border: 1px solid black;
            background-color: #fff; /* 배경색#1 */
        }

        header {
            width: 100%;
            height: 120px; /* 이미지의 120px 반영 */
            border: 1px dashed black;
            background-color: #eee; /* 배경색#2 */
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        main {
            width: 100%;
            /* 내부 section 높이(200+200) + 여백 등을 고려해 자동 조절되거나 고정 */
            border: 1px dashed black;
            background-color: #ddd; /* 배경색#3 */
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        section {
            width: 100%;
            height: 200px; /* 이미지의 200px 반영 */
            border: 1px dashed black;
            background-color: #fff; /* 내부 구분을 위한 배경색 */
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        /* 마지막 section의 아래 마진 제거 */
        section:last-child {
            margin-bottom: 0;
        }

        footer {
            width: 100%;
            height: 100px; /* 이미지의 100px 반영 */
            border: 1px dashed black;
            background-color: #ccc; /* 배경색#4 */
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="container">
        <header>header</header>
        <main>
            main
            <section>section</section>
            <section>section</section>
        </main>
        <footer>footer</footer>
    </div>
</body>
</html>
