<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Layout #3</title>
    <style>
        /* 기본 초기화 및 공통 스타일 */
        * {
            margin: 0;
            padding: 0;
        }

        #container {
            width: 800px;
            margin: 0 auto;
            padding: 10px;
            border: 1px solid black;
            background-color: #fff; /* 배경색#1 */
        }

        header {
            width: 100%;
            height: 120px; /* 이미지 수치 반영 */
            border: 1px dashed black;
            background-color: #eee; /* 배경색#2 */
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        main {
            width: 100%;
            border: 1px dashed black;
            background-color: #ddd; /* 배경색#3 */
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        section {
            width: 100%;
            border: 1px dashed black;
            background-color: #eee;
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 마지막 section 마진 제거 */
        section:last-of-type {
            margin-bottom: 0;
        }

        article {
            width: 100%;
            height: 200px; /* 이미지의 200px 반영 */
            border: 1px dashed black;
            background-color: #fff;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        /* 마지막 article 마진 제거 */
        article:last-child {
            margin-bottom: 0;
        }

        footer {
            width: 100%;
            height: 100px; /* 이미지 수치 반영 */
            border: 1px dashed black;
            background-color: #ccc; /* 배경색#4 */
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="container">
        <header>header</header>
        <main>
            main
            <section>
                section #1
                <article>article #1</article>
                <article>article #2</article>
            </section>
            <section>
                section #2
                <article>article #1</article>
                <article>article #2</article>
            </section>
        </main>
        <footer>footer</footer>
    </div>
</body>
</html>
