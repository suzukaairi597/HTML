<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Layout #1</title>
    <style>
        /* 공통 스타일 적용 */
        * {
            margin: 0;
            padding: 0;
        }

        #container {
            width: 800px; /* 일반적인 실습 규격 예시 */
            margin: 0 auto;
            padding: 10px;
            border: 1px solid black;
            background-color: #fff; /* 배경색#1 */
        }

        header {
            width: 100%;
            height: 100px;
            border: 1px dashed black;
            background-color: #eee; /* 배경색#2 */
            margin-bottom: 10px;
        }

        main {
            width: 100%;
            height: 400px;
            border: 1px dashed black;
            background-color: #ddd; /* 배경색#3 */
            margin-bottom: 10px;
        }

        footer {
            width: 100%;
            height: 100px;
            border: 1px dashed black;
            background-color: #ccc; /* 배경색#4 */
        }
    </style>
</head>
<body>
    <div id="container">
        <header>header</header>
        <main>main</main>
        <footer>footer</footer>
    </div>
</body>
</html>
